services:
  postgres:
    image: postgres:latest
    container_name: psql
    ports:
      - "5432:5432"
    volumes:    
      - ./habrdb-data:/var/lib/postgresql/data rw
    cap_add:
      - IPC_LOCK
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=mio
      - POSTGRES_PASSWORD=123
      - PGDATA=/var/lib/postgresql/data/pgdata
    

